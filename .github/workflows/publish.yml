name: Publish .NET nuget and create release

on:
  push:
    branches: [ "main" ]

env:
  SOLUTION_FILE_PATH: nanoFramework.Lego.Infrared.sln

permissions:
  contents: write
  id-token: write

jobs:

  before_publish:
    runs-on: ubuntu-latest
    outputs:
      pr-labels: ${{ steps.pr-labels.outputs.result }}
    steps:
    
    # This is getting all the labels sets on the PR
    - name: Get PR labels
      id: pr-labels
      uses: shioyang/check-pr-labels-on-push-action@v1.0.9
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        labels: '["publish"]'
    
  publish:
    runs-on: windows-latest
    if: needs.before_publish.outputs.pr-labels == 'true'
    needs: before_publish
    outputs:
      majorverionpath: ${{ steps.gitversion.outputs.MajorMinorPatch }}
      versionsha: ${{ steps.gitversion.outputs.VersionSourceSha }}
      sha: ${{ steps.gitversion.outputs.Sha }}

    steps:
    # Checkout sources. Depth=0 is for using GitVersion
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

      # Install and Setup GitVersion
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v3
      with:
        versionSpec: '6.x'
    - name: Use GitVersion
      # Step id is used as reference for the output values
      id: gitversion 
      uses: gittools/actions/gitversion/execute@v3

    - name: Set package version
      id: package-version
      shell: pwsh
      run: |
        $version = '${{ steps.gitversion.outputs.MajorMinorPatch }}'
        if ($version -notmatch '^\d+\.\d+\.\d+$') {
          throw "GitVersion produced an invalid release version: '$version'"
        }
        "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
        "version=$version" >> $env:GITHUB_OUTPUT

      # Restore, build and test the project
    - name: Restore dependencies
      run: dotnet restore ./Lego.Infrared/LegoInfrared.csproj
    - name: Build
      run: dotnet build ./Lego.Infrared/LegoInfrared.csproj --no-restore
    - name: Test
      run: dotnet test ./Lego.Infrared/LegoInfrared.csproj --no-build --verbosity normal  

    # Create a nuget Release      
    - name: Pack the NuGet package
      run: dotnet pack ./Lego.Infrared --configuration Release --output ./artifacts -p:PackageVersion=$env:PACKAGE_VERSION -p:UpdateVersionProperties=false

    # debug for version printing
    - name: debug
      run: |
        echo ${{ steps.gitversion.outputs.MajorMinorPatch }}
        echo ${{ steps.gitversion.outputs.VersionSourceSha }}
        echo ${{ steps.gitversion.outputs.Sha }}

    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # Install and Setup nanoFramework
    - uses: nanoframework/nanobuild@v1

    # Install and Setup MSBuild
    - name: Select Visual Studio MSBuild
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
        $msbuild = Join-Path $vsPath "MSBuild\Current\Bin\MSBuild.exe"
        "MSBUILD_EXE=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    
    - name: Install NuGet
      uses: nuget/setup-nuget@v1

    - name: Restore NuGet packages
      shell: pwsh
      run: |
        $solution = Join-Path $env:GITHUB_WORKSPACE $env:SOLUTION_FILE_PATH
        nuget restore $solution

    - name: Build
      id: build
      shell: pwsh
      run: |
        $solution = Join-Path $env:GITHUB_WORKSPACE $env:SOLUTION_FILE_PATH
        & "$env:MSBUILD_EXE" $solution /verbosity:normal /p:Configuration=Release /nologo

    - name: Pack the NuGet package
      working-directory: ${{ github.workspace }}
      run: nuget pack nanoFramework.Lego.Infrared.nuspec -OutputDirectory ./artifacts -Version $env:PACKAGE_VERSION -Symbols -SymbolPackageFormat symbols.nupkg -properties commit="${{ github.sha }}" -Verbosity normal

    - name: Verify package versions
      shell: pwsh
      run: |
        Add-Type -AssemblyName System.IO.Compression.FileSystem

        $packagePaths = @(
          "./artifacts/LegoInfrared.$env:PACKAGE_VERSION.nupkg",
          "./artifacts/LegoInfrared.nanoFramework.$env:PACKAGE_VERSION.nupkg"
        )

        foreach ($packagePath in $packagePaths) {
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $packagePath))
          try {
            $entry = $archive.Entries | Where-Object FullName -Like '*.nuspec' | Select-Object -First 1
            if ($null -eq $entry) {
              throw "No .nuspec found in '$packagePath'"
            }

            $reader = [System.IO.StreamReader]::new($entry.Open())
            try {
              [xml]$nuspec = $reader.ReadToEnd()
            }
            finally {
              $reader.Dispose()
            }

            $actualVersion = $nuspec.package.metadata.version
            if ($actualVersion -ne $env:PACKAGE_VERSION) {
              throw "Package '$packagePath' contains version '$actualVersion'; expected '$env:PACKAGE_VERSION'"
            }
          }
          finally {
            $archive.Dispose()
          }
        }

    - name: debug
      run: |
        ls ./artifacts

    - name: NuGet login (OIDC → temp API key)
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}
        
    # Publish all NuGet packages to NuGet.org
    # Use --skip-duplicate to prevent errors if a package with the same version already exists.
    # If you retry a failed workflow, already published packages will be skipped without error.
    - name: Publish .NET separate tools to NuGet
      run: dotnet nuget push ./artifacts/LegoInfrared.${{ steps.gitversion.outputs.MajorMinorPatch }}.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
    - name: Publish .NET nanoFramework separate tools to NuGet
      run: dotnet nuget push ./artifacts/LegoInfrared.nanoFramework.${{ steps.gitversion.outputs.MajorMinorPatch }}.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate    

    # Create the CHANGELOG for this release
    # We'll compile it from last the version
    # to the current commit
    - name: Build Changelog
      id: github_release
      uses: mikepenz/release-changelog-builder-action@v1
      with:
        configuration: "./changelog-config.json"
        fromTag: ${{ steps.package-version.outputs.version }}
        toTag: ${{ steps.gitversion.outputs.Sha }}
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Create GitHub release and CHANGELOG for Chocolatey and releases
    # NOTE: this is where we prepend "v" before the version in the tag/release
    - name: Create release
      uses: ncipollo/release-action@v1
      with:
        # no artifacts: ""
        body: ${{steps.github_release.outputs.changelog}}
        tag: "v${{ steps.package-version.outputs.version }}"
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: "**/artifacts/*.nupkg"
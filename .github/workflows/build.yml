name: Build .NET and .NET nanoFramework

on:
  pull_request:
    branches: [ "main" ]

env:
  SOLUTION_FILE_PATH: nanoFramework.Lego.Infrared.sln

jobs:
  dotnetbuild:
    runs-on: ubuntu-latest
    steps:
    # Checkout sources. Depth=0 is for using GitVersion
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

      # Install and Setup GitVersion
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v3
      with:
        versionSpec: '6.x'
    - name: Use GitVersion
      # Step id is used as reference for the output values
      id: gitversion 
      uses: gittools/actions/gitversion/execute@v3

      # Restore, build and test the project
    - name: Restore dependencies
      run: dotnet restore ./Lego.Infrared/LegoInfrared.csproj
    - name: Build
      run: dotnet build ./Lego.Infrared/LegoInfrared.csproj --no-restore
    - name: Test
      run: dotnet test ./Lego.Infrared/LegoInfrared.csproj --no-build --verbosity normal  
  
  nanobuild:
    runs-on: windows-latest
    steps:
    # Checkout sources. Depth=0 is for using GitVersion
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    # Install and Setup nanoFramework
    - name: Install nanoFramework
      uses: nanoframework/nanobuild@v1

    - name: Select Visual Studio MSBuild
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
        $msbuild = Join-Path $vsPath "MSBuild\Current\Bin\MSBuild.exe"
        "MSBUILD_EXE=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Install NuGet
      uses: nuget/setup-nuget@v1

    - name: Restore NuGet packages
      shell: pwsh
      run: |
        $solution = Join-Path $env:GITHUB_WORKSPACE $env:SOLUTION_FILE_PATH
        nuget restore $solution

    - name: Build
      shell: pwsh
      run: |
        $solution = Join-Path $env:GITHUB_WORKSPACE $env:SOLUTION_FILE_PATH
        & "$env:MSBUILD_EXE" $solution /verbosity:normal /p:Configuration=Release /nologo